[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investigator-ai"
version = "0.1.0"
description = "A comprehensive fraud investigation tool that aggregates data from legitimate public sources"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "InvestigatorAI Team"}
]
license = {file = "LICENSE"}
keywords = ["fraud", "investigation", "data", "analysis", "compliance"]

dependencies = [
    # Core data collection and analysis
    "requests==2.32.4",
    "pandas==2.3.1",
    "numpy==2.3.2",
    "kaggle==1.7.4.5",
    "python-dotenv==1.1.1",
    "PyPDF2==3.0.1",
    "openai>=1.58.1",
    "openpyxl==3.1.5",
    # AI/ML and LangChain dependencies for enhanced notebook
    "langchain-openai==0.3.28",
    "langchain-core==0.3.72",
    "langchain-community==0.3.27",
    "langgraph==0.6.1",
    "langchain-qdrant>=0.2.0",
    "pydantic==2.11.7",
    "qdrant-client==1.15.0",
    "redis==5.2.0",
    # RAGAS evaluation framework and dependencies
    "ragas==0.3.0",
    "datasets==2.21.0",
    "langsmith==0.4.8",
    "typing-extensions==4.14.1",
    # FastAPI dependencies
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic-settings==2.9.0",
    "pymupdf==1.26.3",
    "pillow==11.1.0",
    "jupyter>=1.0.0",
    "jupyterlab>=3.6.0",
    "notebook>=6.4.0",
    "ipykernel>=6.15.0",
    "ipython>=8.0.0",
    "ipywidgets>=8.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "plotly>=5.0.0",
    "pip",
    "rapidfuzz==3.1.0",
    "rank_bm25==0.2.2",
    "langchain-experimental==0.3.1",
    "langchain-cohere==0.3.1",
    # Migration dependencies (5-hour migration)
    "psutil>=5.9.0", # Memory monitoring for MemoryOptimizer
    "pypdf>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",  # For async tests in migration
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
]
notebook = [
    "jupyter>=1.0.0",
    "jupyterlab>=3.6.0",
    "notebook>=6.4.0",
    "ipykernel>=6.15.0",
    "ipython>=8.0.0",
    "ipywidgets>=8.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "plotly>=5.0.0",
    "pip"
]
evaluation = [
    # Additional evaluation and testing dependencies
    "pytest-asyncio>=0.21.0",
    "asyncio-throttle>=1.0.0",
    "tenacity>=8.0.0",
    "tqdm>=4.64.0",
]
full = [
    "investigator-ai[dev,notebook,evaluation]",
]

[project.urls]
Homepage = "https://github.com/ai-makerspace/InvestigatorAI"
Repository = "https://github.com/ai-makerspace/InvestigatorAI"
Issues = "https://github.com/ai-makerspace/InvestigatorAI/issues"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=api",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=20",
    "-W ignore::DeprecationWarning"
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "asyncio: marks tests as async",
    "integration: marks tests as integration tests",
    "performance: marks tests as performance tests", 
    "stress: marks tests as stress tests",
    "slow: marks tests as slow running",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["api", "investigator_ai"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/site-packages/*",
    "api/agents/multi_agent_system_broken.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "qdrant_client.*",
    "langchain.*", 
    "langchain_openai.*",
    "langchain_core.*",
    "langchain_community.*",
    "langgraph.*",
    "langsmith.*",
    "ragas.*",
    "datasets.*",
    "kaggle.*",
    "PyPDF2.*",
    "rapidfuzz.*",
    "rank_bm25.*"
]
ignore_missing_imports = true

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.setuptools.packages.find]
where = ["."]
include = ["investigator_ai*"]
