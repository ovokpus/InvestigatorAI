<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="InvestigatorAI + GuardianAI: Screen in milliseconds, investigate in minutes">
<title>InvestigatorAI + GuardianAI</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
<linearGradient id="ac" x1="0" x2="1"><stop offset="0" stop-color="#f85149"/><stop offset="1" stop-color="#f0883e"/></linearGradient></defs>
<style>
.t{font:700 46px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f0f6fc} .s{font:400 20px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9da7b3} .c{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e6edf3} .k{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f85149;letter-spacing:.2em}
.w{fill:none;stroke-width:2;stroke-opacity:.35;stroke-dasharray:6 10;animation:flow 6s linear infinite}
.p{animation:tw 4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-160}} @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}} @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="1200" height="300" rx="16" fill="url(#bg)"/>
<path d="M620 300 C 760 200, 900 120, 1200 60" class="w" stroke="#f0883e" style="animation-delay:-0.0s"/><path d="M660 300 C 790 190, 920 132, 1200 88" class="w" stroke="#f85149" style="animation-delay:-1.3s"/><path d="M700 300 C 820 180, 940 144, 1200 116" class="w" stroke="#f0883e" style="animation-delay:-2.6s"/><path d="M740 300 C 850 170, 960 156, 1200 144" class="w" stroke="#f85149" style="animation-delay:-3.9s"/><path d="M780 300 C 880 160, 980 168, 1200 172" class="w" stroke="#f0883e" style="animation-delay:-5.2s"/><path d="M820 300 C 910 150, 1000 180, 1200 200" class="w" stroke="#f85149" style="animation-delay:-6.5s"/><circle cx="700" cy="40" r="2" fill="#f0883e" class="p" style="animation-delay:-0.0s"/><circle cx="773" cy="87" r="3" fill="#f85149" class="p" style="animation-delay:-0.7s"/><circle cx="846" cy="134" r="4" fill="#f0883e" class="p" style="animation-delay:-1.4s"/><circle cx="919" cy="181" r="2" fill="#f85149" class="p" style="animation-delay:-2.1s"/><circle cx="992" cy="228" r="3" fill="#f0883e" class="p" style="animation-delay:-2.8s"/><circle cx="1065" cy="55" r="4" fill="#f85149" class="p" style="animation-delay:-3.5s"/><circle cx="1138" cy="102" r="2" fill="#f0883e" class="p" style="animation-delay:-4.2s"/><circle cx="751" cy="149" r="3" fill="#f85149" class="p" style="animation-delay:-4.9s"/><circle cx="824" cy="196" r="4" fill="#f0883e" class="p" style="animation-delay:-5.6s"/><circle cx="897" cy="243" r="2" fill="#f85149" class="p" style="animation-delay:-6.3s"/><circle cx="970" cy="70" r="3" fill="#f0883e" class="p" style="animation-delay:-7.0s"/><circle cx="1043" cy="117" r="4" fill="#f85149" class="p" style="animation-delay:-7.7s"/><circle cx="1116" cy="164" r="2" fill="#f0883e" class="p" style="animation-delay:-8.4s"/><circle cx="729" cy="211" r="3" fill="#f85149" class="p" style="animation-delay:-9.1s"/><circle cx="802" cy="258" r="4" fill="#f0883e" class="p" style="animation-delay:-9.8s"/><circle cx="875" cy="85" r="2" fill="#f85149" class="p" style="animation-delay:-10.5s"/><circle cx="948" cy="132" r="3" fill="#f0883e" class="p" style="animation-delay:-11.2s"/><circle cx="1021" cy="179" r="4" fill="#f85149" class="p" style="animation-delay:-11.9s"/>
<text x="60" y="74" class="k">FRAUD · MULTI-AGENT · LANGGRAPH</text>
<text x="60" y="130" class="t">InvestigatorAI + GuardianAI</text>
<rect x="60" y="146" width="160" height="4" rx="2" fill="url(#ac)" class="bar" style="transform-origin:60px 148px"/>
<text x="60" y="186" class="s">Screen in milliseconds, investigate in minutes</text>
