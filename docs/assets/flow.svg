<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Data flow: Transaction → GuardianAI → Escalate → Investigation → SAR report">
<title>InvestigatorAI + GuardianAI data flow</title>
<style>
.h{font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f0f6fc} .d{font:400 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9da7b3} .cap{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e;letter-spacing:.15em}
.e{stroke:#8b949e;stroke-width:2;stroke-dasharray:4 5;animation:dash 1.2s linear infinite}
.g{opacity:0;animation:glow 4s ease-in-out infinite}
.dot{offset-distance:0%;animation:move 2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-18}} @keyframes glow{0%,100%{opacity:0}40%{opacity:.12}}
@keyframes move{from{offset-distance:0%;opacity:0}20%{opacity:1}to{offset-distance:100%;opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="1200" height="260" rx="16" fill="#0d1117"/>
<text x="40" y="50" class="cap">HOW DATA FLOWS</text>
<g class="n" style="animation-delay:0.00s"><rect x="40" y="90" width="197" height="96" rx="12" fill="#161b22" stroke="#f85149" stroke-width="2"/><rect x="40" y="90" width="197" height="96" rx="12" fill="#f85149" class="g" style="animation-delay:0.0s"/><text x="138" y="132" text-anchor="middle" class="h">Transaction</text><text x="138" y="156" text-anchor="middle" class="d">incoming</text></g><path d="M237 138 L265 138" class="e"/><path d="M263 133 L271 138 L263 143" fill="#8b949e"/><circle r="4" fill="#f85149" class="dot" style="offset-path:path('M237 138 L265 138');animation-delay:0.0s"/><g class="n" style="animation-delay:0.15s"><rect x="271" y="90" width="197" height="96" rx="12" fill="#161b22" stroke="#f0883e" stroke-width="2"/><rect x="271" y="90" width="197" height="96" rx="12" fill="#f0883e" class="g" style="animation-delay:0.6s"/><text x="369" y="132" text-anchor="middle" class="h">GuardianAI</text><text x="369" y="156" text-anchor="middle" class="d">~10 ms, no LLM</text></g><path d="M468 138 L496 138" class="e"/><path d="M494 133 L502 138 L494 143" fill="#8b949e"/><circle r="4" fill="#f85149" class="dot" style="offset-path:path('M468 138 L496 138');animation-delay:0.4s"/><g class="n" style="animation-delay:0.30s"><rect x="502" y="90" width="197" height="96" rx="12" fill="#161b22" stroke="#f85149" stroke-width="2"/><rect x="502" y="90" width="197" height="96" rx="12" fill="#f85149" class="g" style="animation-delay:1.2s"/><text x="600" y="132" text-anchor="middle" class="h">Escalate</text><text x="600" y="156" text-anchor="middle" class="d">form prefilled</text></g><path d="M698 138 L726 138" class="e"/><path d="M724 133 L732 138 L724 143" fill="#8b949e"/><circle r="4" fill="#f85149" class="dot" style="offset-path:path('M698 138 L726 138');animation-delay:0.8s"/><g class="n" style="animation-delay:0.45s"><rect x="732" y="90" width="197" height="96" rx="12" fill="#161b22" stroke="#f0883e" stroke-width="2"/><rect x="732" y="90" width="197" height="96" rx="12" fill="#f0883e" class="g" style="animation-delay:1.8s"/><text x="831" y="132" text-anchor="middle" class="h">Investigation</text><text x="831" y="156" text-anchor="middle" class="d">RAG · research</text></g><path d="M929 138 L957 138" class="e"/><path d="M955 133 L963 138 L955 143" fill="#8b949e"/><circle r="4" fill="#f85149" class="dot" style="offset-path:path('M929 138 L957 138');animation-delay:1.2s"/><g class="n" style="animation-delay:0.60s"><rect x="963" y="90" width="197" height="96" rx="12" fill="#161b22" stroke="#f85149" stroke-width="2"/><rect x="963" y="90" width="197" height="96" rx="12" fill="#f85149" class="g" style="animation-delay:2.4s"/><text x="1062" y="132" text-anchor="middle" class="h">SAR report</text><text x="1062" y="156" text-anchor="middle" class="d">compliance</text></g>
<text x="40" y="232" class="d">Low-risk transactions clear at screening; risky ones go to the agents.</text>
</svg>