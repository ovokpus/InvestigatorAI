# Local stack. `docker compose up --build` works with no API keys (screening-only mode).
# Add OPENAI_API_KEY (+ TAVILY_SEARCH_API_KEY) to .env for multi-agent investigations, then
# `docker compose --profile rag up init-docs` once to load the regulatory PDFs into Qdrant.
services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports: ["${QDRANT_PORT:-6333}:6333"]
    volumes: [qdrant_storage:/qdrant/storage]

  init-docs:
    profiles: [rag]
    build:
      context: .
      dockerfile: rag/Dockerfile.init
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_PROVIDER: local
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}
      VECTOR_COLLECTION_NAME: regulatory_documents
      PDF_DATA_PATH: data/pdf_downloads
    depends_on: [qdrant]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports: ["${API_PORT:-8000}:8000"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      QDRANT_URL: http://qdrant:6333
      QDRANT_PROVIDER: local
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TAVILY_SEARCH_API_KEY: ${TAVILY_SEARCH_API_KEY:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-InvestigatorAI-Local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4000}
      GUARDIAN_FRAUD_THRESHOLD: ${GUARDIAN_FRAUD_THRESHOLD:-0.3}
      CACHE_ENABLED: "true"
      LOG_LEVEL: INFO
    depends_on:
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  redis_data:
  qdrant_storage:
