# Railway configuration for InvestigatorAI
# This works with existing Railway project with repo, redis, and qdrant services

[build]
builder = "dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
startCommand = "uvicorn api.main:app --host 0.0.0.0 --port $PORT"

# Main API service (using your existing "repo" service)
[[services]]
name = "repo"
source = "../"
dockerfile = "api/Dockerfile"

[services.repo.variables]
PORT = "8000"
PYTHONPATH = "/app"
REDIS_HOST = "${{Redis.RAILWAY_PRIVATE_DOMAIN}}"
REDIS_PORT = "6379"
QDRANT_HOST = "${{Qdrant.RAILWAY_PRIVATE_DOMAIN}}"
QDRANT_PORT = "6333"
ALLOWED_ORIGINS = "https://*.railway.app,https://*.up.railway.app"
LOG_LEVEL = "INFO"
DEBUG = "false"
CACHE_ENABLED = "true"
BM25_ENABLED = "true"
DEFAULT_RETRIEVAL_METHOD = "auto"
ENABLE_PERFORMANCE_LOGGING = "true"
RATE_LIMIT_REQUESTS = "10"
RATE_LIMIT_WINDOW = "60"
MAX_MEMORY_MB = "1024"
CLEANUP_THRESHOLD = "0.8"

# Redis service (using your existing "redis" service)
[[services]]
name = "redis"
source = "redis:7-alpine"

[services.redis.variables]
REDIS_ARGS = "--appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru"

# Qdrant service (using your existing "qdrant" service)
[[services]]
name = "qdrant"
source = "qdrant/qdrant:latest"

[services.qdrant.variables]
QDRANT__SERVICE__HTTP_PORT = "6333"
QDRANT__SERVICE__GRPC_PORT = "6334"
QDRANT__LOG_LEVEL = "INFO"
